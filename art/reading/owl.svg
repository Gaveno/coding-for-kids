<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Word Safari mascot: a friendly reading owl -->
  <!-- Body -->
  <ellipse cx="100" cy="118" rx="62" ry="66" fill="#8D6E63"/>
  <ellipse cx="100" cy="130" rx="44" ry="48" fill="#D7CCC8"/>
  <!-- Belly feather scallops -->
  <g fill="#BCAAA4">
    <circle cx="84" cy="118" r="9"/>
    <circle cx="102" cy="120" r="9"/>
    <circle cx="118" cy="116" r="9"/>
    <circle cx="92" cy="136" r="9"/>
    <circle cx="110" cy="136" r="9"/>
  </g>
  <!-- Ear tufts -->
  <path d="M48 62 L60 30 L74 56 Z" fill="#6D4C41"/>
  <path d="M152 62 L140 30 L126 56 Z" fill="#6D4C41"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="52" fill="#8D6E63"/>
  <!-- Eyes -->
  <circle cx="80" cy="68" r="20" fill="#FFF8E7"/>
  <circle cx="120" cy="68" r="20" fill="#FFF8E7"/>
  <circle cx="82" cy="70" r="9" fill="#37474F"/>
  <circle cx="118" cy="70" r="9" fill="#37474F"/>
  <circle cx="85" cy="67" r="3" fill="#FFFFFF"/>
  <circle cx="121" cy="67" r="3" fill="#FFFFFF"/>
  <!-- Round reading glasses -->
  <circle cx="80" cy="68" r="22" fill="none" stroke="#F9A825" stroke-width="4"/>
  <circle cx="120" cy="68" r="22" fill="none" stroke="#F9A825" stroke-width="4"/>
  <line x1="98" y1="66" x2="102" y2="66" stroke="#F9A825" stroke-width="4"/>
  <!-- Beak -->
  <path d="M100 82 L91 94 Q100 104 109 94 Z" fill="#FB8C00"/>
  <!-- Wings holding the book -->
  <ellipse cx="46" cy="122" rx="16" ry="34" fill="#6D4C41" transform="rotate(18 46 122)"/>
  <ellipse cx="154" cy="122" rx="16" ry="34" fill="#6D4C41" transform="rotate(-18 154 122)"/>
  <!-- Open book -->
  <g>
    <path d="M56 150 Q78 138 100 150 Q122 138 144 150 L144 176 Q122 164 100 176 Q78 164 56 176 Z" fill="#FFF8E7" stroke="#C9BBA4" stroke-width="3"/>
    <line x1="100" y1="150" x2="100" y2="176" stroke="#C9BBA4" stroke-width="3"/>
    <!-- Text lines -->
    <g stroke="#90A4AE" stroke-width="3" stroke-linecap="round">
      <line x1="66" y1="154" x2="90" y2="152"/>
      <line x1="66" y1="162" x2="90" y2="160"/>
      <line x1="110" y1="152" x2="134" y2="154"/>
      <line x1="110" y1="160" x2="134" y2="162"/>
    </g>
  </g>
  <!-- Feet -->
  <g fill="#FB8C00">
    <ellipse cx="82" cy="184" rx="12" ry="7"/>
    <ellipse cx="118" cy="184" rx="12" ry="7"/>
  </g>
</svg>
