<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎣 Robo Go Fish</title>
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/robots.css">
    <link rel="stylesheet" href="styles/overlays.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <a href="../index.html" class="home-btn" aria-label="Back to Home">🏠</a>
            <div class="logo" aria-label="Robo Go Fish game">🎣🤖</div>
            <div class="win-indicator">
                <span class="star" aria-hidden="true">⭐</span>
                <span class="win-num" id="winCount" aria-label="Games won">0</span>
            </div>
            <button class="help-btn" id="helpBtn" aria-label="Help">❓</button>
        </header>

        <!-- Main game area -->
        <main class="game-main">
            <!-- Robot opponents (1-3 panels, built by UI.js) -->
            <div class="robots-row" id="robotsRow" aria-label="Robot opponents"></div>

            <!-- Pond in the middle -->
            <section class="pond-area" aria-label="Card pond">
                <div class="turn-indicator" id="turnIndicator" aria-live="polite">👇</div>
                <button class="pond-btn" id="pondBtn" aria-label="Fish pond - draw a card">
                    <span class="pond-water" aria-hidden="true">🌊</span>
                    <span class="pond-count" id="pondCount">38</span>
                </button>
                <div class="bubble player-bubble" id="playerBubble" aria-live="polite"></div>
            </section>

            <!-- Player side -->
            <section class="player-area" id="playerArea" aria-label="Your cards">
                <div class="sets-row player-sets" id="playerSets" aria-label="Your collected parts"></div>
                <div class="player-hand" id="playerHand" role="list"></div>
            </section>
        </main>

        <!-- Setup overlay: how many robots + how tricky -->
        <div class="overlay visible" id="setupOverlay">
            <div class="overlay-content setup-content">
                <h2 class="setup-title" aria-label="Robo Go Fish">🎣🤖</h2>

                <div class="setup-section">
                    <div class="setup-label" aria-label="How many robots?">🤖❓</div>
                    <div class="setup-row" id="robotChoices">
                        <button class="choice-btn" data-robots="1" aria-label="1 robot">
                            <span class="choice-emoji">🤖</span>
                        </button>
                        <button class="choice-btn" data-robots="2" aria-label="2 robots">
                            <span class="choice-emoji">🤖👾</span>
                        </button>
                        <button class="choice-btn" data-robots="3" aria-label="3 robots">
                            <span class="choice-emoji">🤖👾🛸</span>
                        </button>
                    </div>
                </div>

                <div class="setup-section">
                    <div class="setup-label" aria-label="How good is the robots' memory?">🧠❓</div>
                    <div class="setup-row" id="diffChoices">
                        <button class="choice-btn" data-diff="easy" aria-label="Easy - robots are forgetful">
                            <span class="choice-emoji">🌱</span>
                            <span class="choice-hint">🧠💤</span>
                        </button>
                        <button class="choice-btn" data-diff="medium" aria-label="Medium - robots remember half the time">
                            <span class="choice-emoji">⭐</span>
                            <span class="choice-hint">🧠❓</span>
                        </button>
                        <button class="choice-btn" data-diff="hard" aria-label="Hard - robots remember everything">
                            <span class="choice-emoji">🔥</span>
                            <span class="choice-hint">🧠⚡</span>
                        </button>
                    </div>
                </div>

                <button class="start-btn" id="startBtn" aria-label="Start game">▶️</button>
            </div>
        </div>

        <!-- Game over overlay -->
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-content">
                <div class="game-over-icon" id="gameOverIcon">🎉</div>
                <div class="game-over-score" id="gameOverScore"></div>
                <button class="replay-btn" id="replayBtn" aria-label="Play again">
                    🔄
                </button>
            </div>
        </div>

        <!-- Help overlay -->
        <div class="overlay" id="helpOverlay">
            <div class="overlay-content help-content">
                <h2 class="help-title">🎣 Robo Go Fish 🤖</h2>

                <div class="help-section">
                    <h3>🎯 Goal</h3>
                    <div class="help-icons">
                        <div class="help-icon">
                            <span>⚙️⚙️⚙️⚙️</span>
                            <span>Collect 4 of a kind</span>
                        </div>
                        <div class="help-icon">
                            <span>🦾</span>
                            <span>Build your robot!</span>
                        </div>
                    </div>
                </div>

                <div class="help-section">
                    <h3>🎮 How to Play</h3>
                    <div class="help-icons">
                        <div class="help-icon">
                            <span>👇⚙️</span>
                            <span>Tap a card to pick it</span>
                        </div>
                        <div class="help-icon">
                            <span>👆🤖</span>
                            <span>Tap a glowing robot to ask</span>
                        </div>
                        <div class="help-icon">
                            <span>🤖✅</span>
                            <span>Robots give matches</span>
                        </div>
                        <div class="help-icon">
                            <span>🎣🌊</span>
                            <span>No match? Go fish!</span>
                        </div>
                        <div class="help-icon">
                            <span>🤖👾</span>
                            <span>Robots ask each other too!</span>
                        </div>
                        <div class="help-icon">
                            <span>🧠</span>
                            <span>Robots remember your asks!</span>
                        </div>
                    </div>
                </div>

                <button class="close-help-btn" id="closeHelpBtn" aria-label="Close help">
                    👍
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
